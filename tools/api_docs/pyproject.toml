[project]
name = "kagdocs"
version = "0.1.0"
description = "Generate the vanilla KAG AngelScript reference"
requires-python = ">=3.12"
dependencies = [
    "markdown==3.7",
    "pyyaml==6.0.2",
    "tree-sitter==0.25.2",
]

[project.scripts]
kagdocs = "kagdocs.cli:main"
kagdocs-test = "kagdocs.cli:python_tests"

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kagdocs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# HTML templates are long on purpose. Wrapping them makes the renderer harder to read.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kagdocs"]
